spring:
  application:
    name: hanare-be
  datasource:
    url: ${HANARE_DB_URL:jdbc:postgresql://localhost:5432/hanare}
    username: ${HANARE_DB_USER:hanare}
    password: ${HANARE_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      add-mappings: false
  jackson:
    # T-09: không ép ngầm kiểu — 1.5 không thành số nguyên 1, "true" (chuỗi) không thành boolean
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

hanare:
  jwt:
    # Bắt buộc >= 32 byte; chỉ profile dev/test có giá trị mặc định.
    secret: ${HANARE_JWT_SECRET:}
    ttl: PT8H
  cors:
    allowed-origins: http://localhost:5173

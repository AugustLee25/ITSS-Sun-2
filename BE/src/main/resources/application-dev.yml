# Profile dev: PostgreSQL của docker-compose.yml (docker compose up -d db)
spring:
  datasource:
    url: ${HANARE_DB_URL:jdbc:postgresql://localhost:5432/hanare}
    username: ${HANARE_DB_USER:hanare}
    password: ${HANARE_DB_PASSWORD:hanare}

hanare:
  jwt:
    # Không có secret mặc định trong repo (H-01): để trống thì tự sinh khóa ngẫu nhiên mỗi lần khởi động. Production phải đặt
    # HANARE_JWT_SECRET.
    secret: ${HANARE_JWT_SECRET:}

logging:
  level:
    app.hanare: DEBUG
